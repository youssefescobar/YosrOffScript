<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- Meta tags for sharing (WhatsApp, iMessage, etc.) -->
    <meta property="og:title" content="Yosr OffScript" />
    <meta property="og:description" content="Creative Director + Designer" />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/preview.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/preview.png" />

    <title>Yosr OffScript</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- ====== LOADER ====== -->
      <div class="loader" id="loader">
        <div class="loader__inner">
          <h1 class="loader__name">
            <span class="loader__line"><span>Yosr OffScript</span></span>
          </h1>
          <p class="loader__tagline"><span>Creative Director + Designer</span></p>
          <div class="loader__progress" id="loader-progress">0%</div>
          <p class="loader__cta" id="loader-cta"><span>Click or scroll to enter</span></p>
        </div>
      </div>

      <!-- ====== MAIN EXPERIENCE ====== -->
      <div class="viewport" id="viewport">
        <!-- Infinite wrapping canvas -->
        <div class="canvas" id="canvas">
          <!-- tiles injected by JS -->
        </div>
      </div>

      <!-- Fixed header -->
      <header class="header" id="header">
        <div class="header__left">
          <span class="header__name">Yosr OffScript</span>
        </div>
        <nav class="header__nav">
          <a href="#portfolio" class="header__link active">Portfolio</a>
          <a href="#about" class="header__link">About</a>
        </nav>
      </header>

      <!-- Fixed footer -->
      <footer class="footer" id="footer">
        <div class="footer__left">
          <span class="footer__count" id="tile-count"></span>
        </div>
        <div class="footer__center">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="branding">Branding</button>
          <button class="filter-btn" data-filter="editorial">Editorial</button>
          <button class="filter-btn" data-filter="digital">Digital</button>
          <button class="filter-btn" data-filter="motion">Motion</button>
        </div>
        <div class="footer__right">
          <span class="footer__hint">Drag to explore</span>
        </div>
      </footer>

      <!-- About panel -->
      <section class="about-panel" id="about-panel">
        <div class="about-panel__inner">
          <h2>About</h2>
          <p>
            Creative director & designer based in the digital space.
            This is a demo archive inspired by the infinite canvas concept.
            Replace this text with your own story.
          </p>
          <button class="about-panel__close" id="about-close">&times;</button>
        </div>
      </section>

      <!-- Project panel -->
      <section class="project-panel" id="project-panel">
        <button class="project-panel__close" id="project-close">&times;</button>
        <div class="project-panel__inner" id="project-inner">
          <!-- Dynamic project content injected by JS -->
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
