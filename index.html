<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Yosr Off Script — Portfolio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- ====== LOADER ====== -->
      <div class="loader" id="loader">
        <div class="loader__inner">
          <h1 class="loader__name">
            <span class="loader__line"><span>Yosr</span></span>
            <span class="loader__line"><span>Off Script</span></span>
          </h1>
          <p class="loader__tagline"><span>Creative Director + Designer</span></p>
          <p class="loader__cta"><span>Scroll to enter</span></p>
        </div>
      </div>

      <!-- ====== EXPERIENCE ====== -->
      <main class="experience" id="experience">
        <!-- 3D stage -->
        <div class="stage" id="stage">
          <div class="world" id="world">
            <!-- tiles injected by JS -->
          </div>
        </div>

        <!-- Top-left header overlay -->
        <header class="archive-header">
          <span class="archive-header__title">Archive</span>
          <span class="archive-header__count" id="tile-count"></span>
        </header>

        <!-- Navigation overlay -->
        <nav class="nav-overlay" id="nav">
          <a href="#archive" class="nav-overlay__link active">Archive</a>
          <a href="#about" class="nav-overlay__link">About</a>
        </nav>

        <!-- Filter bar -->
        <div class="filter-bar" id="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="branding">Branding</button>
          <button class="filter-btn" data-filter="editorial">Editorial</button>
          <button class="filter-btn" data-filter="digital">Digital</button>
          <button class="filter-btn" data-filter="motion">Motion</button>
        </div>

        <!-- About panel (hidden by default) -->
        <section class="about-panel" id="about-panel">
          <div class="about-panel__inner">
            <h2>About</h2>
            <p>
              Creative director & designer based in the digital space.
              This is a demo portfolio inspired by the walkable 3D archive concept.
              Replace this text with your own story.
            </p>
            <button class="about-panel__close" id="about-close">&times;</button>
          </div>
        </section>

        <!-- Vignette overlays -->
        <div class="vignette vignette--top"></div>
        <div class="vignette vignette--bottom"></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
